site_name: rates-algo-trading
site_description: Open-source Java principal e-trading platform for interest rate swaps and government bonds, built on public data.
site_author: Ashish Jha
site_url: https://ashjha0.github.io/rates-algo-trading/
repo_url: https://github.com/AshJha0/rates-algo-trading
repo_name: AshJha0/rates-algo-trading
edit_uri: ""
copyright: Copyright 2026 Ashish Jha. Apache License 2.0.

docs_dir: docs/site/pages
site_dir: site

hooks:
  - docs/site/hooks.py

nav:
  - Home: index.md
  - Learn: learn.md
  - Cookbook: cookbook.md
  - API contract: api-spec.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - Decisions: decisions.md
  - Status: status.md
  - Diagrams: diagrams.md
  - Research notebooks:
      - Hit-rate model: notebooks/hitrate.md
      - Markouts: notebooks/markouts.md
      - Spread optimisation: notebooks/spread.md
      - Order flow: notebooks/flow.md
      - Back-test analysis: notebooks/backtest_analysis.md
  - Edge studies:
      - Findings: edge-studies.md
      - E1 auction cycle: notebooks/edge_e1_auction.md
      - E2 month-end extension: notebooks/edge_e2_monthend.md
      - E3 intraday releases: notebooks/edge_e3_intraday.md
      - E4 trade size: notebooks/edge_e4_size.md
      - E5 swap spread: notebooks/edge_e5_swapspread.md
      - E6 carry tilt: notebooks/edge_e6_carry.md
  - Desk features: desk-features.md
  - P&L audit: pnl-audit.md
  - Compliance inventory: compliance.md
  - Runbooks: runbooks.md
  - AI use policy: ai-use-policy.md
  - Changelog: changelog.md
  - Publishing: publishing.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
