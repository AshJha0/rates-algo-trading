limitations: >
  About 50 fitting weeks and 78 holdout weeks: low power. The swap rate is a median of public
  prints, not a dealer mark, and the OIS rate (annual, act/360) and the par yield (semi-annual)
  differ in convention, which shifts the level of the spread but not much its weekly change.
  Positioning is weekly and released with a three-day lag.
