success_threshold: >
  E5 passes the programme test rule at the central band point (14:30 to 16:00 ET fixing): mean
  of u_w positive, 95 percent moving-block bootstrap interval (blocks of 4 weeks, 2000 resamples)
  above zero, Holm-adjusted p below 0.05, and out-of-sample R^2 above zero.
assumption_band:
  parameter: OIS fixing window
  points: [low, central, high]
  values: {low: 15:00 to 15:30 ET, central: 14:30 to 16:00 ET, high: whole day}
author: Ashish Jha (owner); drafted with Claude (ai-assisted, docs/AI_USE_POLICY.md)
date: 2026-10-31
