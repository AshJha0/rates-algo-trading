# Pre-registration EDGE-E5. Written and hashed on 2026-10-31 before the CFTC, DTCC and par-curve
# data it tests were downloaded or read for this study.
# Format: API_SPEC.md Section 16.8; shared rules: research/prereg/edge_programme.yaml.
# period is the holdout test period; holdout lists the reserve dates (not read by this programme).
prereg_version: 1
id: EDGE-E5
title: Next-week 10Y swap spread change from CFTC positioning and the last change
hypothesis: >
  An OLS forecast of next week's change in the 10Y SOFR OIS minus Treasury spread, fitted on 2024
  from the change in leveraged-fund net positioning in 10Y note futures and the last week's
  spread change, has positive out-of-sample covariance with the realised change and positive
  out-of-sample R^2 on 2025-01-01 to 2026-06-30. Expected weak.
metric: forecast times realised weekly change, standardised; out-of-sample R^2
baseline: no predictability (zero covariance; the fitting-period mean change as the forecast)
treatments: [ols_forecast]
period: {start: 2025-01-01, end: 2026-06-30}
fitting_period: {start: 2024-01-01, end: 2024-12-31}
holdout: [
  2026-07-01, 2026-07-02, 2026-07-03, 2026-07-06, 2026-07-07, 2026-07-08, 2026-07-09,
  2026-07-10, 2026-07-13, 2026-07-14, 2026-07-15, 2026-07-16, 2026-07-17, 2026-07-20,
  2026-07-21, 2026-07-22, 2026-07-23, 2026-07-24, 2026-07-27, 2026-07-28, 2026-07-29,
  2026-07-30, 2026-07-31, 2026-08-03, 2026-08-04, 2026-08-05, 2026-08-06, 2026-08-07,
  2026-08-10, 2026-08-11, 2026-08-12, 2026-08-13, 2026-08-14, 2026-08-17, 2026-08-18,
  2026-08-19, 2026-08-20, 2026-08-21, 2026-08-24, 2026-08-25, 2026-08-26, 2026-08-27,
  2026-08-28, 2026-08-31, 2026-09-01, 2026-09-02, 2026-09-03, 2026-09-04, 2026-09-07,
  2026-09-08, 2026-09-09, 2026-09-10, 2026-09-11, 2026-09-14, 2026-09-15, 2026-09-16,
  2026-09-17, 2026-09-18, 2026-09-21, 2026-09-22, 2026-09-23, 2026-09-24, 2026-09-25,
