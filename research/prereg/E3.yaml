success_threshold: >
  Each of E3a, E3b, E3c, E3d is judged by the programme test rule at the central band point
  (all control days): positive mean of x_d, 95 percent moving-block bootstrap interval (blocks
  of 2 days, 2000 resamples) above zero, Holm-adjusted p below 0.05, and ratio at least 1.25
  (E3a, E3b, E3d) or above 1 (E3c). The study is supported if E3a or E3b passes; only passed
  windows are promoted.
assumption_band:
  parameter: control set
  points: [low, central, high]
  values: {low: control days within 20 business days, central: all control days, high: adds Thursdays to control_0830}
author: Ashish Jha (owner); drafted with Claude (ai-assisted, docs/AI_USE_POLICY.md)
