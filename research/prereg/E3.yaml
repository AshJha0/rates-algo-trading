limitations: >
  Swap data repository prints are executions, not RFQs or quotes: intensity of prints stands in
  for RFQ intensity. Print rates mix dealers, sizes and clearing venues, so print-to-print changes
  contain bid-offer bounce; the 10 bp filter removes off-market prints but not bounce. Block
  trades are disseminated late but carry their execution time. Eight FOMC days in the holdout
  give low power for E3b.
