# Pre-registration EDGE-E3. Written and hashed on 2026-10-31 before the DTCC files of
# 2025-01-02 to 2026-06-30 and the release calendars were downloaded or read for this study
# (P5 used nine DTCC files of 2025-10-01 to 2025-10-14 for an intraday trade-count profile; those
# days are inside this study's holdout and their profile is a different statistic).
# Format: API_SPEC.md Section 16.8; shared rules: research/prereg/edge_programme.yaml.
# period is the holdout test period; holdout lists the reserve dates (not read by this programme).
prereg_version: 1
id: EDGE-E3
title: Swap print volatility and intensity around 08:30 releases, FOMC and the SOFR publication
hypothesis: >
  Realised variance of USD SOFR OIS print rates per 5-minute bucket is at least 1.25 times its
  control level from 08:30 to 08:45 ET on scheduled release days (E3a) and from 14:00 to 14:30
  ET on FOMC statement days (E3b); trade intensity from 08:30 to 08:45 ET on release days is at
  least 1.25 times control (E3d); the 08:00 ET SOFR publication bucket shows more realised
  variance than its adjacent buckets (E3c, expected weak).
metric: >
  Per event day, window realised variance (or trade count) per 5-minute bucket divided by the
  mean over control days of the period, minus one; unit one event day.
baseline: control days of the same period (config day_types), ratio one
treatments: [release_0830, fomc_1400, sofr_0800, release_0830_intensity]
period: {start: 2025-07-01, end: 2026-06-30}
fitting_period: {start: 2025-01-02, end: 2025-06-30}
holdout: [
  2026-07-01, 2026-07-02, 2026-07-03, 2026-07-06, 2026-07-07, 2026-07-08, 2026-07-09,
  2026-07-10, 2026-07-13, 2026-07-14, 2026-07-15, 2026-07-16, 2026-07-17, 2026-07-20,
