# Pre-registration AUDIT-13, the production-engine re-run of the P&L audit (audit fix package D,
# docs/research/PNL_AUDIT.md). Written, hashed and committed before the evaluation period was run.
# Format: API_SPEC.md Section 16.8, validated by PreRegistration.requireValid and
# ratesresearch.prereg.validate. Run with research/audit/run_desk_audit.sh, which records one
# ledger row whatever the result.
prereg_version: 1
id: AUDIT-13
title: "AUDIT-03's design on the production engine: hedge execution and its cost model"
hypothesis: >
  AUDIT-03 found market-order hedging into the future the largest cost of model_spread. The
  production Hedger stages tranches and the routers send child orders, which the back-tester
  fills as market orders (DR-R2W-11). Expected: (a) linear_hedge_cost, the fill rule before audit
  package D (one full tick beyond the touch for any positive impact), shows a lower P&L than the
  engine with the depth-walk rule, which sizes the cost-model bias on the production hedger;
  (b) hedge_interval_5s, measuring the residual every 5 s instead of every 250 ms, earns more by
  hedging less often; (c) max_lots_100 and max_lots_2000 change the most lots per hedge plan, and
  the sign of their effect is not predicted.
metric: >
  Total position P&L per recorded session in USD, rounded to cents (cash plus the final position
  at the final mid; attribution reconciled to it on every run). Unit of analysis: one session of
  15 simulated minutes from 08:25 New York. Each difference is also reported per 1,000,000 USD of
  client DV01 traded, normalised by the engine's mean per session at that band point.
baseline: engine
treatments: [linear_hedge_cost, hedge_interval_5s, max_lots_100, max_lots_2000]
period: {start: 2026-03-02, end: 2026-03-27}
fitting_period: {start: 2026-01-05, end: 2026-01-16}
holdout: [2026-04-06, 2026-04-07, 2026-04-08, 2026-04-09, 2026-04-10]
success_threshold: >
  Per variant and band point (low, central, high): Welch's two-sided test of variant against
  engine session P&L, Holm-adjusted over every (variant, band point) test of this
  pre-registration, below 0.05, and the 95 percent moving-block bootstrap interval (blocks of 2
  sessions, 2000 resamples, seed 11) of the paired session difference entirely above zero:
  supported. Adjusted p below 0.05 and interval entirely below zero: reversed. Otherwise
  inconclusive. The size is the paired mean difference with its interval, reported whatever the
  verdict. The row is void if any run's attribution residual exceeds one cent.
assumption_band:
  preset: usd_rfq_hit_rate
  parameter: spread_to_cover_bp
  points: [low, central, high]
author: Ashish Jha (owner); drafted with Claude (ai-assisted, docs/AI_USE_POLICY.md)
date: 2026-10-31
config: research/prereg/AUDIT-13.config.yaml
config_sha256: e3d48c01e4f6d7e97d0db46cdbbbaa0958114ebaf0aed83ca62d4b0e8441a1ab
limitations: >
  Simulated sessions only (DR-008): the D2C simulator's dealers, the back-tester's competitor
  model and win-probability slope are declared assumptions, so every number is a simulator
  consistency check, not edge. The sessions are recordings of the P2 venue simulators, not the
  synthetic days of AUDIT-01 to AUDIT-04, so absolute sizes are not comparable with those rows;
  the comparison is of signs and of sizes per 1mm USD of client DV01. Sessions are 15 simulated
  minutes, not a full day, because a replay of the production desk costs about 3 s of CPU per
  simulated minute. The back-tester has no resting-order cancel, so the desk's child orders are
  filled as market orders (DR-R2W-11). Labels are session keys for the seed rule; every session
  is the simulators' trading date 2026-11-02. A pilot on fitting-period labels with a scratch
  ledger checked the harness before this file was committed; its numbers are not used. The
  holdout is not opened.
