  2026-10-16, 2026-10-19, 2026-10-20, 2026-10-21, 2026-10-22, 2026-10-23, 2026-10-26,
  2026-10-27, 2026-10-28, 2026-10-29, 2026-10-30,
]
success_threshold: >
  E4a: two one-sided bootstrap tests against 0.025 and 0.10, p = the larger, Holm-adjusted p
  below 0.05 and the 95 percent interval inside [0.025, 0.10]. E4b: the programme test rule with
  threshold 0.1 trades. Moving-block bootstrap over days, blocks of 5, 2000 resamples, central
  band point (capped prints censored). The study is supported if E4a passes; E4b is promoted
  only if it passes.
assumption_band:
  parameter: treatment of capped notionals
  points: [low, central, high]
  values: {low: drop capped prints, central: right-censor at the cap, high: cap as exact value}
author: Ashish Jha (owner); drafted with Claude (ai-assisted, docs/AI_USE_POLICY.md)
date: 2026-10-31
