# Pre-registration EDGE-E4. Written and hashed on 2026-10-31 before the DTCC files of
# 2025-01-02 to 2026-06-30 were downloaded or read for this study (P5 fitted the preset
# usd_rfq_flow on nine DTCC days of 2025-10-01 to 2025-10-14, inside this holdout; that fit
# pooled tenors and is not reused here).
# Format: API_SPEC.md Section 16.8; shared rules: research/prereg/edge_programme.yaml.
# period is the holdout test period; holdout lists the reserve dates (not read by this programme).
prereg_version: 1
id: EDGE-E4
title: Swap trade size by tenor and clustering after large trades
hypothesis: >
  A censored lognormal fitted per tenor (2, 5, 10, 30 years) on the fitting period keeps its
  95th percentile calibrated out of sample: the daily share of holdout trades at or above it is
  between 2.5 and 10 percent (E4a). After a trade at or above the fitted 90th percentile, the
  same tenor sees at least 0.1 more trades in the next 5 minutes than its time-of-day average
  (E4b).
metric: >
  E4a: mean over holdout days of the share of trades at or above the fitted p95 of their tenor.
  E4b: mean over holdout days of the per-large-trade excess count in the next 5 minutes.
baseline: >
  E4a: nominal 5 percent exceedance (equivalence band 2.5 to 10 percent). E4b: the time-of-day
  expected count (excess zero).
treatments: [p95_calibration, post_large_trade_clustering]
period: {start: 2025-07-01, end: 2026-06-30}
fitting_period: {start: 2025-01-02, end: 2025-06-30}
holdout: [
  2026-07-01, 2026-07-02, 2026-07-03, 2026-07-06, 2026-07-07, 2026-07-08, 2026-07-09,
  2026-07-10, 2026-07-13, 2026-07-14, 2026-07-15, 2026-07-16, 2026-07-17, 2026-07-20,
  2026-07-21, 2026-07-22, 2026-07-23, 2026-07-24, 2026-07-27, 2026-07-28, 2026-07-29,
