config_sha256: 55d791bf328d6eef6c8200afff5f447078d0dbc76731caf775a404b12e58fb40
limitations: >
  Disseminated notionals above the CFTC caps are shown as the cap, so the upper tail above the
  cap is not observed and the lognormal extrapolates it. Prints are executions across all
  dealers and venues, not the RFQs one dealer sees. FINRA Treasury trades are expected to be
  unavailable without an account; a synthetic fixture stands in and is used for no inference.
