limitations: >
  The index extension itself is proprietary (index providers publish it to subscribers); the
  proxy is term-weighted coupon issuance settling in the month, which misses maturing and
  called debt and index rule changes. Daily closes only; 66 holdout months give about 22
  high-extension months, so only a large effect can pass.
