# Audit config for pre-registration AUDIT-04 (research/prereg/AUDIT-04.yaml): scheduled releases and inventory skew.
# Its SHA-256 (text, LF line endings) is pinned in the pre-registration; any edit invalidates it.
# Variants are read by research/audit/PnlAudit.java; 'engine' reproduces the back-tester's
# model_spread strategy (checked to the cent on every run).
experiment: AUDIT-04
presets: data/presets.yaml
# day seed = day_seed_base + epoch day of the session date (the P5-001 rule, another base)
day_seed_base: 6000000
outcome_seed: 7
# the P5-001 model_spread inputs, estimated on 2026-01-05..2026-01-16 (data/experiments/P5-001.config.yaml)
pricing:
  adverse_bp_by_tier: [0.0241, 0.0667, 0.1300]
  swap_hedge_cost_bp: 0.2459
  bond_hedge_cost_bp: 0.2459
  max_half_spread_bp: 2.0
  grid_step_bp: 0.01
statistics:
  bootstrap_block_days: 2
  bootstrap_resamples: 2000
  bootstrap_seed: 11
  level: 0.95
  alpha: 0.05
variants:
  engine:
    spread: model
    hedge_mode: ty_market
    hedge_threshold_dv01: 100000
    replica_of: model_spread
  release_guard:
    spread: model
    guard_events: [0, 1]
    guard_before_s: 60
    guard_after_s: 30
    hedge_mode: ty_market
    hedge_threshold_dv01: 100000
  skew_0p05:
    spread: model
    skew_bp_per_100k_dv01: 0.05
    hedge_mode: ty_market
    hedge_threshold_dv01: 100000
  skew_0p20:
    spread: model
    skew_bp_per_100k_dv01: 0.20
    hedge_mode: ty_market
    hedge_threshold_dv01: 100000
