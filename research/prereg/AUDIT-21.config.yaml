# Audit config for pre-registration AUDIT-21 (research/prereg/AUDIT-21.yaml): AUDIT-01's design (spread against the cover) on the production engine.
# Its SHA-256 (text, LF line endings) is pinned in the pre-registration; any edit invalidates it.
# Variants are read by research/audit/DeskAudit.java.
experiment: AUDIT-21
presets: data/presets.yaml
# Each session is a recording of rates-app's TradingProcess (D2C RFQ and CLOB simulators with the
# production desk in the loop), driven single-threaded from 08:25 New York on the simulators'
# trading date (TradingProcess.DEFAULT_START), so it spans the 08:30 release. seed = day_seed_base
# + epoch day of the session label.
session:
  day_seed_base: 8000000
  minutes: 15
  step_ms: 10
outcome_seed: 7
statistics:
  bootstrap_block_days: 2
  bootstrap_resamples: 2000
  bootstrap_seed: 11
  level: 0.95
  alpha: 0.05
# Every variant replays the session through the P5 back-tester with rates-app's DeskStrategy (the
# production QuotingEngine, RiskEngine, Hedger and routers). Unless a variant says otherwise:
# the hedge fill rule is the depth walk (HedgeCostModel.withDepthWalk(true)), bond coupons accrue
# (CarryModel.bondCoupons from the reference data), the client is the hit-rate client, and the
# desk runs DeskSettings.defaults().
variants:
  engine: {}
  best_price_client:
    client: best_price
  cap_0p25:
    max_half_spread_bp: 0.25
  unclamped:
    min_half_spread_bp: 0.0
    max_half_spread_bp: 2.0
