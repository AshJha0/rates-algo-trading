[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratesresearch"
version = "1.0.0"
description = "Research package for rates-algo-trading: provenance, journal verification, flow and hit-rate fits, markouts, spread tables, back-test analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Jha" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
    "scipy>=1.11",
]
notebooks = [
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
# QuantLib golden generator (research/ratesresearch/goldens); the version is pinned so the
# committed golden file regenerates exactly (DECISIONS.md DR-P1-06).
golden = [
    "QuantLib==1.44",
]

[tool.setuptools.packages.find]
include = ["ratesresearch*"]

[tool.setuptools.package-data]
ratesresearch = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "C4"]

[tool.mypy]
strict = true
files = ["ratesresearch"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
