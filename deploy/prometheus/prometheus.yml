# Scrapes the processes of the simulated environment (deploy/compose.yaml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trading
    metrics_path: /metrics
    static_configs:
      - targets: ["trading-blue:8081", "trading-green:8082"]
  - job_name: venue-sim
    metrics_path: /metrics
    static_configs:
      - targets: ["venue-sim:8090"]
