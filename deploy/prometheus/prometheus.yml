# Scrapes the processes of the simulated environment (deploy/compose.yaml) over HTTPS. The
# certificate is checked against ca.pem, which the compose file mounts from RATES_CERTS_DIR. The
# rehearsal's test certificate names localhost, not the compose service names, so server_name says
# which name to expect; a deployment whose certificates name its hosts drops that line.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trading
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/ca.pem
      server_name: localhost
    static_configs:
      - targets: ["trading-blue:8081", "trading-green:8082"]
  - job_name: venue-sim
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/ca.pem
      server_name: localhost
    static_configs:
      - targets: ["venue-sim:8090"]
