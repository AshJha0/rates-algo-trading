# Trading process, blue colour, with the low-latency runtime profile (DECISIONS.md DR-R6-L02).
# The same desk as trading-blue.yaml; only the runtime section differs. Use it on a host that
# reserves cores for the process: the loop, the two FIX session threads and the feed thread
# busy-spin, and the journal threads too, so this profile keeps about seven cores at 100 %.
# Pin them to cores the scheduler leaves alone (isolcpus/nohz_full on the host, or a cpuset:
# docker run --cpuset-cpus=2-8); without that, spinning threads compete with everything else and
# do worse than the default profile. The CPU numbers below assume cores 2 to 5 are reserved.
# Schema: schema/process-config.schema.json (API_SPEC.md Section 17.11).
schemaVersion: 1
process:
  name: trading-blue
  role: trading
  colour: blue
http:
  # Loopback by default. A container sets RATES_HTTP_BIND=0.0.0.0 (deploy/compose.yaml); the
  # process then refuses to start unless the control token is set and http.tls is configured.
  bindAddress: 127.0.0.1
  port: 8081
  controlTokenEnv: RATES_CONTROL_TOKEN
  # HTTPS for health, metrics and control. The key store is provided at deploy time (a mounted
  # directory or a secret mount) and is never committed; its password is named, not written.
  tls:
    keyStorePath: /run/rates/certs/server-keystore.p12
    keyStorePasswordEnv: RATES_HTTP_KEYSTORE_PASSWORD
journal:
  directory: /var/lib/rates/journal
  capacityBytes: 67108864
quoting:
  enabledAtStart: true
  instruments:
    - instrumentId: 2001
      venueId: 2
      maxQuoteSizeMinor: 10000000000
    - instrumentId: 1001
      venueId: 1
      maxQuoteSizeMinor: 5000000000
limits:
  maxOrderNotionalMinor: 25000000000
  maxNetDv01Minor: 5000000
  maxMessagesPerSecond: 200
recon:
  cutTimeUtc: "17:00"
  timingToleranceMillis: 1000
retention:
  years: 5
# FIX sessions to the venue simulators, which run inside this process. Sequence numbers resume
# after a restart. Every store below is provided at deploy time and never committed; every
# password is named by an environment variable (or a ...File path), never written here.
fix:
  resetOnLogon: false
  transport: tls
  tls:
    trustStorePath: /run/rates/certs/truststore.p12
    trustStorePasswordEnv: RATES_FIX_TRUSTSTORE_PASSWORD
    verifyHostname: true
    handshakeTimeoutMillis: 5000
  acceptor:
    keyStorePath: /run/rates/certs/server-keystore.p12
    keyStorePasswordEnv: RATES_FIX_ACCEPTOR_KEYSTORE_PASSWORD
    requireClientCertificate: false
  credentials:
    username: RATESMM
    passwordEnv: RATES_FIX_PASSWORD
  reconnect:
    maxAttempts: 5
    initialBackoffMillis: 100
    maxBackoffMillis: 2000
# Threads and journals (API_SPEC.md Section 17.11). The profile sets busy-spinning loop, session,
# feed and journal threads, ring journals with the WORD64 chain hash and locked segments, and
# conflated curve inputs; the CPUs are this host's.
runtime:
  profile: lowLatency
  loopCpu: 2
  gatewayCpu: 3
