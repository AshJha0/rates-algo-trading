# Venue simulator process. Until P2's simulator is bound it serves health and metrics only.
schemaVersion: 1
process:
  name: venue-sim
  role: venue-sim
  colour: blue
http:
  # Loopback by default. A container sets RATES_HTTP_BIND=0.0.0.0 (deploy/compose.yaml); the
  # process then refuses to start unless the control token is set and http.tls is configured.
  bindAddress: 127.0.0.1
  port: 8090
  controlTokenEnv: RATES_CONTROL_TOKEN
  # HTTPS for health, metrics and control. The key store is provided at deploy time (a mounted
  # directory or a secret mount) and is never committed; its password is named, not written.
  tls:
    keyStorePath: /run/rates/certs/server-keystore.p12
    keyStorePasswordEnv: RATES_HTTP_KEYSTORE_PASSWORD
journal:
  directory: /var/lib/rates/venue-journal
  capacityBytes: 67108864
quoting:
  enabledAtStart: false
  instruments: []
limits:
  maxOrderNotionalMinor: 25000000000
  maxNetDv01Minor: 5000000
  maxMessagesPerSecond: 1000
recon:
  cutTimeUtc: "17:00"
  timingToleranceMillis: 1000
retention:
  years: 5
