# Experiment config for pre-registration P5-001 (data/preregs/P5-001.yaml).
# Its SHA-256 (text, LF line endings) is pinned in the pre-registration; any edit invalidates it.
experiment: P5-001
presets: data/presets.yaml
# day seed = day_seed_base + epoch day of the session date (SyntheticDayCli uses the same rule)
day_seed_base: 5000000
outcome_seed: 7
strategies:
  fixed_spread:
    swap_half_spread_bp: 0.30
    bond_half_spread_bp: 0.15
    hedge_threshold_dv01: 100000
  model_spread:
    # expected adverse mid move at 1 min by tier, bp, and hedge cost per bp of client DV01, both
    # estimated on the fitting period 2026-01-05..2026-01-16 with fixed_spread at the central band
    # point (ratesresearch.markouts.adverse_bp_by_tier; STATUS.md and LEARN.md Section 10)
    adverse_bp_by_tier: [0.0241, 0.0667, 0.1300]
    swap_hedge_cost_bp: 0.2459
    bond_hedge_cost_bp: 0.2459
    max_half_spread_bp: 2.0
    grid_step_bp: 0.01
    hedge_threshold_dv01: 100000
statistics:
  bootstrap_block_days: 2
  bootstrap_resamples: 2000
  bootstrap_seed: 11
  level: 0.95
  alpha: 0.05
