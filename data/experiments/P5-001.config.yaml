# Experiment config for pre-registration P5-001 (data/preregs/P5-001.yaml).
# Its SHA-256 (text, LF line endings) is pinned in the pre-registration; any edit invalidates it.
experiment: P5-001
presets: data/presets.yaml
# day seed = day_seed_base + epoch day of the session date (SyntheticDayCli uses the same rule)
day_seed_base: 5000000
outcome_seed: 7
strategies:
  fixed_spread:
    swap_half_spread_bp: 0.30
    bond_half_spread_bp: 0.15
    hedge_threshold_dv01: 100000
  model_spread:
    # expected adverse mid move at 1 min by tier, bp, estimated on the fitting period
    adverse_bp_by_tier: [0.0, 0.0, 0.0]
    swap_hedge_cost_bp: 0.0
    bond_hedge_cost_bp: 0.0
    max_half_spread_bp: 2.0
    grid_step_bp: 0.01
    hedge_threshold_dv01: 100000
statistics:
  bootstrap_block_days: 2
  bootstrap_resamples: 2000
  bootstrap_seed: 11
  level: 0.95
  alpha: 0.05
