    event_half_width_minutes, utc_offset_hours (-5, for the February synthetic sessions) and size_cap_mm
    are declared, not fitted, and carry no standard error.
- name: usd_rfq_hit_rate
  fitted_from: 'synthetic labels: ratesresearch.hitrate.simulate_labels(n=40000, seed=20261031) from usd_rfq_competition'
  data_range:
    start: '2026-10-31'
    end: '2026-10-31'
  sample_size: 40000
  method: logistic regression, Newton-Raphson MLE, research/ratesresearch/hitrate.py::fit
  parameters:
    intercept:
      value: 1.240823849
      standard_error: 0.0578175
    spread_to_cover_bp:
      value: -2.574597077
      standard_error: 0.0436463
    log_size_mm:
      value: -0.157251093
      standard_error: 0.0110627
    tenor_years:
      value: -0.008049931038
      standard_error: 0.00120681
    fixing_window:
      value: 0.3161668027
      standard_error: 0.0303997
    dealer_count:
      value: -0.2604089275
      standard_error: 0.0118778
    oos_log_loss_model:
      value: 0.614613803
      standard_error: null
    oos_log_loss_constant:
      value: 0.6900216663
      standard_error: null
  assumptions:
    spread_to_cover_bp:
      band:
        low: -1.25
        central: -2.5
        high: -5.0
      rationale: 'Win-probability slope per bp of spread-to-cover. No public source shows losing quotes
        (DR-008), so the slope is declared: central -2.5 per bp (a quote 0.2 bp behind the cover loses
        about 0.6 of its log-odds), low -1.25 (clients loyal, price matters less), high -5.0 (clients
        pick the best price almost always). Results are reported at all three points.'
  notes: 'Fitted to labels drawn from the declared simulator model, so the fit recovers the assumption;
    it is not a market hit rate (DR-008). The back-tester replaces spread_to_cover_bp by the band value
    of each run. Out-of-sample log-loss on the last 12000 labels: model 0.6146, constant 0.6900.'
