# Fitted parameter presets for the venue simulators and analytics.
#
# Phase 0: schema only, no fitted values. Entries are added in P1 and P2 when a
# source has been downloaded, its manifest committed (data/manifests/), and the
# fit reproduced from that manifest. Raw data is never committed (DECISIONS.md DR-006).
#
# Schema (one list item per preset):
#
#   - name:         short identifier used in code and reports, e.g. usd_sofr_rfq_arrivals
#     fitted_from:  the manifest file under data/manifests/ (or "assumption" for
#                   declared, unfitted values such as the RFQ win-probability band, DR-008)
#     data_range:   { start: YYYY-MM-DD, end: YYYY-MM-DD } of the source data
#     sample_size:  integer count of observations used
#     method:       one line naming the estimator and the script or notebook that ran it
#     parameters:   mapping of parameter name to { value: number, standard_error: number }
#                   standard_error is null for assumptions and for parameters without one
#     notes:        optional; scaling assumptions (DR-004) and caveats go here
#     assumptions:  optional (added in P5, DR-P5-01); mapping of parameter name to
#                   { band: { low: number, central: number, high: number }, rationale: text }
#                   for declared assumptions reported across a band (DR-008)
#
# Dates are written as quoted strings so YAML readers do not turn them into timestamps.
#
# Example of the shape (not a real fit; values are placeholders and must not be used):
#
#   - name: example_preset
#     fitted_from: data/manifests/example_manifest.json
#     data_range: { start: 2026-01-02, end: 2026-06-30 }
#     sample_size: 0
#     method: "maximum likelihood, research/ratesresearch/<module>.py::<function>"
#     parameters:
#       rate_per_minute: { value: 0.0, standard_error: 0.0 }
#     notes: "placeholder, replaced in P1"

presets:
- name: usd_hedge_cost
  fitted_from: assumption
  data_range:
    start: '2026-10-31'
    end: '2026-10-31'
  sample_size: 0
  method: declared assumption, research/ratesresearch/assumptions.py::hedge_cost
  parameters:
    impact_ticks_per_lot:
      value: 0.0002
      standard_error: null
    max_impact_ticks:
      value: 1.0
      standard_error: null
    fee_per_lot:
      value: 1.5
      standard_error: null
    queue_trade_share:
      value: 0.6
      standard_error: null
    order_latency_ms:
      value: 2.0
      standard_error: null
  notes: Futures hedges cross half the book spread plus 0.2 tick per 1000 contracts (capped at 1 ticks)
    and pay 1.50 USD per contract in fees. In the queue model 60 percent of displayed size decreases are
    trades.
- name: usd_rfq_competition
  fitted_from: assumption
  data_range:
    start: '2026-10-31'
    end: '2026-10-31'
  sample_size: 0
  method: declared assumption, research/ratesresearch/assumptions.py::competition
  parameters:
    median_half_spread_bp:
      value: 0.25
      standard_error: null
    tenor_slope:
      value: 0.3
      standard_error: null
    size_slope:
      value: 0.15
      standard_error: null
    bond_multiplier:
      value: 0.5
      standard_error: null
    lognormal_sigma:
      value: 0.35
      standard_error: null
    true_intercept:
      value: 1.2
      standard_error: null
    true_log_size_mm:
      value: -0.15
      standard_error: null
    true_tenor_years:
      value: -0.01
      standard_error: null
    true_fixing_window:
      value: 0.3
      standard_error: null
    true_dealer_count:
      value: -0.25
      standard_error: null
  notes: Competing dealers quote lognormal half-spreads around a median that widens with tenor and size;
    Treasuries quote half as wide in yield bp. The true_* coefficients are the logistic the label simulator
    uses; the slope is the band below.
  assumptions:
    spread_to_cover_bp:
      band:
        low: -1.25
        central: -2.5
        high: -5.0
      rationale: 'Win-probability slope per bp of spread-to-cover. No public source shows losing quotes
        (DR-008), so the slope is declared: central -2.5 per bp (a quote 0.2 bp behind the cover loses
        about 0.6 of its log-odds), low -1.25 (clients loyal, price matters less), high -5.0 (clients
        pick the best price almost always). Results are reported at all three points.'
