name: Forward log

# Paper trading (docs/research/PAPER_TRADING_PLAN.md). Each run fetches the latest Treasury
# business day's real rates, closes the open decision of the hash-chained ledger and writes the
# next one, then commits the ledger, the input file and the reports to the forward-log branch.
# main is never written. Free: a public repository on GitHub-hosted runners.
#
# Unattended, so it looks after itself in two ways. Each scheduled run re-enables this workflow
# through the API, which restarts the 60 days after which GitHub disables a schedule in a
# repository with no other activity. And the alert job opens (or updates) one issue when a
# scheduled run fails or the ledger shows a business day without a decision, and closes it when
# the log is up to date again.
#
# 01:30 UTC Tuesday to Saturday: after the Treasury par curve (late afternoon New York time) and
# the DTCC end-of-day slice (about 00:15 UTC) of the Monday-to-Friday day before.

on:
  schedule:
    - cron: "30 1 * * 2-6"
  workflow_dispatch:

concurrency:
  group: forward-log
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes the forward-log branch
      actions: write # re-enables this workflow (keepalive)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: code
      - name: Check out (or start) the forward-log branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" forward-log >/dev/null; then
            git clone --depth 1 --branch forward-log \
              "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" log
          else
            mkdir log && cd log && git init -b forward-log
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: code/**/pom.xml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c code/research/requirements-lock.txt -e code/research
      - name: Fetch the day's rates
        id: fetch
        working-directory: code
        run: |
          set +e
          python -m ratesresearch.forward.fetch --inputs-dir ../log/forward/inputs
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$rc"
      - name: Run the cycle
        if: steps.fetch.outputs.skip != 'true'
        working-directory: code
        env:
          FORWARD_MVN_FLAGS: -B -ntp
        run: |
          as_of=$(ls ../log/forward/inputs | sort | tail -1 | sed 's/\.json$//')
          research/forward/run_forward.sh --forward-dir "$PWD/../log/forward" --as-of "$as_of" \
            --commit "$(git rev-parse HEAD)"
          python -m ratesresearch.forward.check ../log/forward/ledger.jsonl
          cat ../log/forward/reports/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to forward-log
        if: steps.fetch.outputs.skip != 'true'
        working-directory: log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "forward log: $(ls forward/inputs | sort | tail -1 | sed 's/\.json$//')"
          git push origin forward-log
      - name: A decision from every business day
        # Runs whatever happened above, so a day lost to an earlier failed or skipped run is
        # reported by the next run that does start.
        if: always()
        working-directory: code
        run: python -m ratesresearch.forward.health ../log/forward | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the schedule alive
        # Enabling an enabled workflow changes nothing except the date GitHub counts 60 days from.
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/forward.yml/enable"

  alert:
    name: Open or close the alert issue
    needs: cycle
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Forward log: a scheduled run failed or a trading day is missing"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.cycle.result }}
    steps:
      - name: Open, update or close the issue
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$RESULT" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The forward log is up to date again: $RUN_URL"
            fi
            exit 0
          fi
          body="The scheduled forward-log run ended with result '$RESULT': $RUN_URL

          The job summary of that run says what failed; the step 'A decision from every business day' lists any missing day. A missed day cannot be back-filled (the decision must precede the session), so the gap stays in the ledger and is reported as it is."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
