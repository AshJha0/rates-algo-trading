name: Mutation testing

# PIT mutation testing of the four modules where a wrong number costs most: risk, quoting,
# journal and analytics. It answers a question line coverage cannot: would a test fail if this
# line were wrong? Slow, so it runs weekly and on request, and never gates a pull request. The
# HTML and XML reports are uploaded; the job summary shows the kill rate per module.

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:
    inputs:
      modules:
        description: Comma-separated modules to mutate
        default: rates-risk,rates-quoting,rates-journal,rates-analytics

concurrency:
  group: mutation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  pit:
    name: PIT (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install the modules the mutated ones depend on
        env:
          MODULES: ${{ inputs.modules || 'rates-risk,rates-quoting,rates-journal,rates-analytics' }}
        run: mvn -B -ntp -DskipTests -Djacoco.skip=true -Dspotbugs.skip=true -pl "$MODULES" -am install
      - name: Mutate
        env:
          MODULES: ${{ inputs.modules || 'rates-risk,rates-quoting,rates-journal,rates-analytics' }}
        run: mvn -B -ntp -Ppit -Djacoco.skip=true -Dspotbugs.skip=true -pl "$MODULES" test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Kill rate per module
        if: always()
        run: python3 tools/pit_summary.py rates-*/target/pit-reports/mutations.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-reports
          path: "**/target/pit-reports/"
          if-no-files-found: warn
