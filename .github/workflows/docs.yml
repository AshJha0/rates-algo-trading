name: Docs

# Builds the MkDocs site with --strict on every pull request and on main, and
# deploys it to GitHub Pages from main once the repository's Pages source is
# set to "GitHub Actions" (Settings -> Pages). Until then the site is built and
# checked but not deployed. See docs/GITHUB_PAGES.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (mkdocs --strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_source: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Front pages name the latest release (tools/check_site_current.py)
        run: python tools/check_site_current.py
      - run: python -m pip install -r docs/site/requirements.txt
      - name: Execute research notebooks (rendered into the site by docs/site/hooks.py)
        run: |
          python -m pip install -e "research[notebooks]"
          python tools/run_notebooks.py
      - name: Build
        run: mkdocs build --strict
      - name: Pages source
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          if [ "$build_type" != "workflow" ]; then
            echo "::notice::Pages source is '$build_type', not 'GitHub Actions'; the site was built but not deployed."
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.pages.outputs.build_type == 'workflow'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_source == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
