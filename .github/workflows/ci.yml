name: CI

# Gating jobs: Java on JDK 25 LTS (Linux and Windows), Python, and the repository
# policy check. The JDK 27 job is a forward-compatibility signal and does not gate
# (DR-003). The docs site is built by docs.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  java:
    name: Java 25 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, test, coverage, SpotBugs
        run: mvn -B -ntp verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-${{ matrix.os }}
          path: "**/target/site/jacoco/jacoco.xml"
          if-no-files-found: ignore

  java-forward:
    name: Java 27 forward-compatibility (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - run: mvn -B -ntp verify

  latency:
    name: Latency harness (informational)
    # Hosted runners share hardware, so these numbers never gate (DR-005); the JSON
    # reports and the JVM logs are uploaded so runs can be compared by hand.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build without tests
        run: mvn -B -ntp -DskipTests -Djacoco.skip=true -Dspotbugs.skip=true install
      - name: Short latency run (10 s warm-up, 20 s measured, 50,000 per second)
        run: >
          mvn -B -ntp -pl rates-bench exec:exec@latency
          -Dlatency.warmup=10 -Dlatency.measure=20 -Dlatency.idle=yield
          -Dlatency.label=github-hosted-ubuntu
      - name: Wired desk over loopback FIX, eight configurations (10 s warm-up, 30 s measured, 1,000 RFQ/s)
        # The real trading process with the trading image's JVM flags (docs/BENCHMARKS_V2.md). Every
        # run is kept; a configuration that fails is reported and the others still run.
        if: always()
        run: >
          mvn -B -ntp -pl rates-bench exec:exec@wired
          -Dwired.warmup=10 -Dwired.measure=30 -Dwired.rate=1000
          -Dwired.label=github-hosted-ubuntu
      - name: Percentiles to the job summary
        if: always()
        run: |
          python3 tools/latency_summary.py rates-bench/target/latency/latency-*.json | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/latency_summary.py rates-bench/target/wired/wired-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload latency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latency-report
          path: |
            rates-bench/target/latency/
            rates-bench/target/wired/
          if-no-files-found: warn

  python:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c research/requirements-lock.txt -e "research[dev,golden,notebooks]"
      - name: Lint and format
        run: ruff check research && ruff format --check research
      - name: Type-check
        working-directory: research
        run: mypy
      - name: Tests
        run: pytest -q research
      - name: Experiment ledger hash chain and looks per data set
        # Fails when a row of data/ledger/ledger.jsonl was edited, removed or reordered. The
        # looks report is information: repeated looks at one data set are history, not an error.
        run: python -m ratesresearch.prereg data/ledger/ledger.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cookbook quotes its programs and recorded output (runs the Python recipes)
        run: python tools/check_cookbook.py
      - name: Research notebooks execute
        run: python tools/run_notebooks.py

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Word policy (DR-007)
        run: |
          if git grep -I -i -n -e "interv""iew" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::role-preparation material must be titled learning or knowledge check (DR-007)"
            exit 1
          fi
      - name: No raw data downloads committed (DR-006)
        run: |
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && stat -c "%s %n" "{}"' | awk '$1 > 2000000 {print $2}')
          if [ -n "$big" ]; then
            echo "::error::files over 2 MB are not committed; fit parameters and small fixtures only: $big"
            exit 1
          fi
